<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Editor fictício</title><style>body{font:13px system-ui;margin:0;color:#333}header{display:flex;gap:10px;align-items:center;padding:12px;border-bottom:1px solid #ccc}header a{margin-left:auto}header span.divider{border-left:1px solid #ccc;height:20px}.layout{display:flex}aside{width:250px;flex-shrink:0;border-right:1px solid #ddd;padding:10px;max-height:650px;overflow:auto}.collapse-list{padding-left:8px}.collapse-list>ul{display:none;padding-left:8px}.collapse-list.active>ul{display:block}.folder-title{font-weight:600;cursor:pointer;margin:8px 0}li{list-style:none;padding:5px;cursor:pointer}.selected{background:#e7f1e5}.tab-item{display:none}.tab-item.active{display:block}.tab-item p{margin:10px}.topbar{padding:10px;display:flex;gap:20px;border-block:1px solid #eee}.topbar button{margin-left:auto}main{min-width:0;flex:1}.cm-editor{height:420px}.cm-scroller{overflow:auto}.tools{padding:12px;background:#fff6dd;display:flex;gap:8px;align-items:center;flex-wrap:wrap}button{padding:7px;cursor:pointer}.holder-icon{display:inline-block}.loading{padding:25px}</style></head><body>
<header><div><span id="editor-title">Editor de código</span><span class="divider"></span></div><div><span id="shop-name">Loja de testes</span></div><div><input aria-label="Buscar arquivos" placeholder="Buscar arquivos"></div><div><a target="_blank" href="https://loja-exemplo.invalid?preview=true"><span>Ver prévia</span></a><button id="publish">Publicar loja</button></div></header>
<div class="layout"><aside id="tree"></aside><main><div id="tab" class="tab-item active"><p></p><span class="holder-icon"></span></div><div class="topbar"><span id="version">Este arquivo não tem versões salvas</span><button id="save" disabled>Salvar arquivo</button></div><div id="editor"></div></main></div>
<div class="tools"><span>Controles de teste:</span><select id="remote-file" aria-label="Arquivo remoto fictício"></select><button id="external-change">Alterar arquivo na loja fictícia</button><button id="switch-shop">Trocar loja fictícia</button><button id="reset">Reiniciar dados fictícios</button><output id="test-info">Publicações: 0</output></div>
<script src="bridge.js"></script><script type="module" src="fixture.js"></script></body></html>
